[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hka"
version = "0.1.0"
description = "崩坏学园2每日任务自动化工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10,<13", "opencv-python>=4.8,<5", "numpy>=1.24,<3",
                "rapidocr>=3.9,<4", "onnxruntime>=1.20,<2"]

[project.scripts]
hka = "hka.cli:main"

[tool.setuptools.packages.find]
include = ["hka*"]

[tool.setuptools.package-data]
hka = ["ui/*.html", "assets/*.png"]
