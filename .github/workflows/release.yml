name: Windows Portable Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install . opencv-python-headless
      - name: Prepare built-in ADB
        run: python -c "from pathlib import Path; import urllib.request, zipfile; Path('dist').mkdir(exist_ok=True); p='dist/platform-tools_r36.0.2-win.zip'; urllib.request.urlretrieve('https://dl.google.com/android/repository/platform-tools_r36.0.2-win.zip',p); zipfile.ZipFile(p).extractall('.')"
      - name: Verify tests and prepare OCR models
        run: |
          python -m unittest discover -s tests -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "from hka.ocr import _engine; _engine()"
      - name: Build and check portable package
        run: |
          python tools/build_portable.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/check_portable.py
      - name: Publish portable ZIP
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: HKA ${{ inputs.tag }} Windows Portable
          draft: false
          fail_on_unmatched_files: true
          files: dist/HKA-Windows-x64.zip
